services:
  db:
    image: postgres:16-alpine
    container_name: entitlements-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: entitlements
      POSTGRES_USER: entitlements
      POSTGRES_PASSWORD: entitlements
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entitlements -d entitlements"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lightweight DB browser so you can eyeball the schema/data without a client install.
  # http://localhost:8081  (System: PostgreSQL, Server: db, Username/Password: entitlements, DB: entitlements)
  adminer:
    image: adminer:4.8.1
    container_name: entitlements-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  # Backend - builds the same pom.xml you've already verified with `mvn package`.
  backend:
    build: ./backend
    container_name: entitlements-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Frontend - Vite build served as static files via nginx. Published on 5173 to
  # match the backend's hardcoded CORS allowlist (WebConfig.java) and the default
  # VITE_API_BASE in src/api.js (http://localhost:8080/api), so no config changes
  # were needed to containerize either side.
  frontend:
    build: ./frontend
    container_name: entitlements-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
