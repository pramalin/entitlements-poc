spring:
  application:
    name: entitlements-llm-utility

  main:
    banner-mode: off
    # No spring-boot-starter-web on the classpath, so Spring Boot already infers a
    # NONE web application type - stated here anyway for clarity, since "why doesn't
    # this open a port" is a natural question the first time you look at this file.
    web-application-type: none

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/entitlements
    username: entitlements
    password: entitlements
    driver-class-name: org.postgresql.Driver

  ai:
    openai:
      # Local vLLM server by default (OpenAI-compatible API) - switching to a cloud
      # OpenAI-compatible provider later is just an env var change, no code change.
      base-url: ${OPENAI_BASE_URL:http://192.168.1.251:8000}
      # vLLM doesn't require real auth, but Spring AI's OpenAI client wants a
      # non-blank api-key property regardless - "not-needed" is the documented
      # convention for local/self-hosted OpenAI-compatible servers.
      api-key: ${OPENAI_API_KEY:not-needed}
      chat:
        model: ${OPENAI_MODEL:qwen/qwen3.5}

logging:
  level:
    com.alai.entitlements.llmutility: INFO
  pattern:
    console: "%msg%n"
