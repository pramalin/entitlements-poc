spring:
  application:
    name: entitlements-llm-utility

  main:
    banner-mode: off
    # No spring-boot-starter-web on the classpath, so Spring Boot already infers a
    # NONE web application type - stated here anyway for clarity, since "why doesn't
    # this open a port" is a natural question the first time you look at this file.
    web-application-type: none

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/entitlements
    username: entitlements
    password: entitlements
    driver-class-name: org.postgresql.Driver

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5}

logging:
  level:
    com.alai.entitlements.llmutility: INFO
  pattern:
    console: "%msg%n"
